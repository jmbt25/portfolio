# Sources scout reads daily.
#
# Curated starter list. Edit freely — scout will adapt, but the file itself is
# hand-tended. Scout can no longer add or remove sources on its own.
#
# Fields:
#   name:   human-readable label
#   url:    RSS/Atom feed (preferred) or a stable page URL scout can scrape
#   weight: optional 1..3 hint to scout for prioritization (default 2)
#   tags:   optional list, used by scout to short-circuit relevance checks
#   note:   optional human note about provenance / caveats
#
# IMPORTANT: every hostname here must also be in the WebFetch allowlist in
# .github/workflows/scout.yml. The two lists must stay in sync. Scout cannot
# fetch any host that is not allowlisted, and cannot follow a redirect to one.

sources:
  - name: Anthropic News
    url: https://www.anthropic.com/news
    weight: 3
    tags: [anthropic, claude, mcp]
    note: first-party news index page (HTML). Replaced a third-party GitHub mirror.

  - name: Anthropic Engineering
    url: https://www.anthropic.com/engineering
    weight: 3
    tags: [anthropic, engineering, claude-code]
    note: first-party engineering index page (HTML). Replaced a third-party GitHub mirror.

  - name: Claude Code Changelog
    url: https://code.claude.com/docs/en/changelog/rss.xml
    weight: 3
    tags: [claude-code, changelog, official]
    note: official Anthropic feed; per-release notes

  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    weight: 3
    tags: [llm, tooling, commentary]

  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    weight: 2
    tags: [openai, capability]

  - name: GitHub Engineering
    url: https://github.blog/engineering/feed/
    weight: 1
    tags: [github, infra]

name: ci

# Identity tripwire only. Fails the build if a removed-agent machinery string or
# an affiliation string with no legitimate home reappears anywhere in the tree.
# The site itself is built by Cloudflare Pages.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: identity tripwire
        run: bash .github/scripts/content-guard.sh
